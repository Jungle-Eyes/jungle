<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Helicopter</title>
<style>
:root{color-scheme:dark;--heli:#ffc233;--ink:#f6f1e7;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:#0e0e22;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;font-family:-apple-system,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;color:var(--ink)}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 6%);display:flex;justify-content:space-between;padding:0 22px;font-size:17px;font-weight:700;pointer-events:none;text-shadow:0 1px 4px #000a}
#ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;background:#0e0e22b3}
#toast{position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);z-index:9;text-align:center;font-size:14px;padding:10px 14px;border-radius:12px;background:#000b;display:none;pointer-events:none}
#ov.start{background:rgba(5,8,20,.28)}
#ov.start h1,#ov.start p{text-shadow:0 2px 10px #000b}
#ov h1{font-size:38px;margin:0 0 10px;letter-spacing:2px}
#ov p{margin:4px 0;font-size:17px;opacity:.9}
#ov b{display:inline-block;margin-top:22px;padding:12px 30px;border-radius:999px;background:var(--heli);color:#1a1a1a;font-size:18px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><span id="s">积分 0</span><span id="b">最高积分 0</span></div>
<div id="toast"></div>
<div id="ov" class="start"><h1>Helicopter</h1><p>手指按住屏幕任意位置，当摇杆拖动</p><p>上下拖：升降　左右拖：转向　松手：悬停</p><p>按住不动，橘色点在圆心：加速</p><p>碰矿石或宝石得 1 积分，躲开魔鬼和洞壁</p><p>撞树干会爆炸，穿过树冠只有树叶乱飞，不会死</p><b>点击起飞</b></div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d'),ov=document.getElementById('ov'),sEl=document.getElementById('s'),bEl=document.getElementById('b');
let W,H,F,F0,Hc,best=0;
try{best=+localStorage.getItem('heli-fpv-best2')||0}catch(e){}
const START_HTML=ov.innerHTML;
bEl.textContent='最高积分 '+best;
function rs(){const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0);F0=F=Math.max(W,H*.55)*.8;Hc=H*.42}
addEventListener('resize',rs);rs();

// 世界参数
const D=80,N=40,Z0=40;
const hash=k=>{let h=Math.imul(k,374761393)+668265263|0;h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967295};
const amp=s=>Math.min(1,s/2500);
const cx=s=>amp(s)*(Math.sin(s*.0005)*220+Math.sin(s*.0012+1.3)*80);
const cy=s=>amp(s)*(Math.sin(s*.0007+.7)*115+Math.sin(s*.0017+2.1)*45);
const hw=s=>Math.max(220,400-s*.003);
const hh=s=>hw(s)*.85;
const lvlAt=s=>1;
function obstacle(k){
  const s=k*D,L=lvlAt(s),thr=Math.min(.14,.05+.012*(L-1));
  if(k<30||hash(k)>thr)return null;
  for(let j=1;j<=9;j++)if(hash(k-j)<=thr)return null;
  const w=hw(s),h=hh(s),sz=w*.26,mv=hash(k+21)<.4;
  return{x:mv?cx(s)+Math.sin(tm*1.6+k)*(w-sz)*.8:cx(s)+(hash(k+7)-.5)*(w-sz)*1.6,y:cy(s)+(hash(k+13)-.5)*(h-sz)*1.6,r:sz/2,mv};
}
function coin(k){
  if(k<25||obstacle(k))return null;
  const s=k*D,w=hw(s),h=hh(s);
  if(hash(k+601)<.035)return{x:cx(s)+(hash(k+602)-.5)*w*1.1,y:cy(s)+(hash(k+603)-.5)*h*1.0,r:16,gem:true,ci:Math.floor(hash(k+604)*4)};
  const g=Math.floor(k/10),r=k%10;
  if(hash(g+900)>.4||r<3||r>7)return null;
  return{x:cx(s)+(hash(g+910)-.5)*w*1.1,y:cy(s)+(hash(g+911)-.5)*h*1.0,r:14};
}

// 状态
let state='idle',S=0,px=0,py=0,vx=0,vy=0,roll=0,lastK=0,tm=0,last=0,overAt=0;
let ph=false,ts=0,tv=0,sx0=0,sy0=0,sp=420,ku=0,kd=0,kl=0,kr=0,ax=0,ay=0,pitch=0;
let danger=0,hitT=0,cseed=0,dtG=.016,boomT=0,lastCeil=false,sparks=[],coins=0,gems=0,coinCol='255,255,255',introT=0,lvl=1,lvlT=0,coinT=0,lastBeep=0,boost=0,holdC=0,dsp=924,vs=0,lkx=0,lky=0,leaves=[],leafT=0,lastLeaf=-9;
const score=()=>coins+gems;
function begin(){S=0;px=0;py=0;vx=0;vy=0;roll=0;lastK=0;ax=0;ay=0;pitch=0;danger=0;lvl=1;lvlT=0;state='play'}
function start(){S=0;px=0;py=0;vx=0;vy=0;roll=0;lastK=0;ax=0;ay=0;pitch=0;danger=0;hitT=0;coins=0;gems=0;lvl=1;lvlT=0;lastBeep=0;boost=0;holdC=0;lkx=0;lky=0;leafT=0;introT=3;sEl.textContent='积分 0';state='intro';ov.style.display='none'}
let AC=null,eng=null,muted=false;
let mediaEl=null,toastT=0;
function unlockMedia(){
  if(mediaEl){if(mediaEl.paused)mediaEl.play().catch(()=>{});return}
  try{
    const n=8000,b=new Uint8Array(44+n),dv=new DataView(b.buffer);
    const w=(o,t)=>{for(let i=0;i<t.length;i++)b[o+i]=t.charCodeAt(i)};
    w(0,'RIFF');dv.setUint32(4,36+n,true);w(8,'WAVE');w(12,'fmt ');dv.setUint32(16,16,true);dv.setUint16(20,1,true);dv.setUint16(22,1,true);dv.setUint32(24,8000,true);dv.setUint32(28,8000,true);dv.setUint16(32,1,true);dv.setUint16(34,8,true);w(36,'data');dv.setUint32(40,n,true);
    for(let i=0;i<n;i++)b[44+i]=128;
    mediaEl=new Audio(URL.createObjectURL(new Blob([b],{type:'audio/wav'})));
    mediaEl.loop=true;mediaEl.setAttribute('playsinline','');
    mediaEl.play().catch(()=>{});
  }catch(e){}
}
function checkAudio(){
  setTimeout(()=>{
    if(!AC||AC.state!=='running'){
      const t=document.getElementById('toast');t.textContent='没有声音？请关掉手机侧面的静音键，再点一下屏幕';t.style.display='block';
      clearTimeout(toastT);toastT=setTimeout(()=>{t.style.display='none'},5000);
    }
  },700);
}
function initAudio(){
  unlockMedia();
  try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}
  if(AC){if(AC.state!=='running')AC.resume();return}
  const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
  AC=new C();AC.resume();checkAudio();
  const ub=AC.createBuffer(1,1,22050),us=AC.createBufferSource();us.buffer=ub;us.connect(AC.destination);us.start(0);
  const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2600;lp.Q.value=.4;
  const cp=AC.createDynamicsCompressor();cp.threshold.value=-12;cp.knee.value=12;cp.ratio.value=8;cp.attack.value=.003;cp.release.value=.2;lp.connect(cp);cp.connect(AC.destination);
  const master=AC.createGain();master.gain.value=muted?0:1.5;master.connect(lp);AC.master=master;
  const g=AC.createGain();g.gain.value=0;g.connect(master);
  const tg=AC.createGain();tg.gain.value=.6;tg.connect(g);
  const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=600;f.connect(tg);
  const o=AC.createOscillator();o.type='sawtooth';o.frequency.value=85;o.connect(f);o.start();
  const lfo=AC.createOscillator();lfo.frequency.value=12;const lg=AC.createGain();lg.gain.value=.4;lfo.connect(lg);lg.connect(tg.gain);lfo.start();
  const nb=AC.createBuffer(1,AC.sampleRate,AC.sampleRate),nd=nb.getChannelData(0);
  for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;
  const ns=AC.createBufferSource();ns.buffer=nb;ns.loop=true;
  const bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.value=500;bp.Q.value=.8;
  const ng=AC.createGain();ng.gain.value=.6;ns.connect(bp);bp.connect(ng);ng.connect(g);ns.start();
  eng={g,o,lfo,bp,ng};
}
function engineTick(on){
  if(!AC||!eng)return;
  const t=AC.currentTime;
  eng.g.gain.setTargetAtTime(on?(.6+.2*boost):0,t,.1);
  if(on)eng.ng.gain.setTargetAtTime(.55+.6*vs,t,.15);
  if(on){eng.o.frequency.setTargetAtTime(82+(sp-420)*.05+ay*10,t,.1);eng.lfo.frequency.setTargetAtTime(11+sp/100,t,.2);eng.bp.frequency.setTargetAtTime(500+(sp-420)*.6,t,.2)}
}
function tone(freq,dur,type,vol,delay,slide){
  if(!AC||muted)return;const t=AC.currentTime+(delay||0);
  const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(freq,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(AC.master);o.start(t);o.stop(t+dur+.02);
}
function sndLevel(){[523,659,784,1047].forEach((f,i)=>tone(f*.7,.2,'triangle',.36,i*.11))}
function sndBeep(){tone(620,.09,'triangle',.32)}
function sndBoom(){
  if(!AC)return;const t=AC.currentTime,rate=AC.sampleRate;
  const mk=(dur,pw)=>{const len=Math.floor(rate*dur),buf=AC.createBuffer(1,len,rate),d=buf.getChannelData(0);
    for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,pw);
    const n=AC.createBufferSource();n.buffer=buf;return n};
  {const n=mk(.12,3),f=AC.createBiquadFilter(),g=AC.createGain();f.type='highpass';f.frequency.value=400;
   g.gain.setValueAtTime(.3,t);g.gain.exponentialRampToValueAtTime(.001,t+.12);n.connect(f);f.connect(g);g.connect(AC.master);n.start(t)}
  {const n=mk(3.6,1.6),f=AC.createBiquadFilter(),g=AC.createGain();f.type='lowpass';
   f.frequency.setValueAtTime(900,t);f.frequency.exponentialRampToValueAtTime(55,t+3.2);
   g.gain.setValueAtTime(.6,t);g.gain.exponentialRampToValueAtTime(.001,t+3.6);n.connect(f);f.connect(g);g.connect(AC.master);n.start(t)}
  tone(120,1.8,'sine',.65,0,40);
  {const n=mk(4.2,1.2),f=AC.createBiquadFilter(),g=AC.createGain();f.type='lowpass';f.frequency.value=160;
   g.gain.setValueAtTime(.001,t);g.gain.linearRampToValueAtTime(.28,t+.5);g.gain.exponentialRampToValueAtTime(.001,t+4.2);
   n.connect(f);f.connect(g);g.connect(AC.master);n.start(t)}
}
['pointerup','touchend','click'].forEach(ev=>addEventListener(ev,initAudio));
function die(ceil){
  state='boom';boomT=0;hitT=1.4;danger=0;lastCeil=!!ceil;cseed=Math.floor(Math.random()*1e6);
  ph=false;ts=0;tv=0;ku=0;kd=0;kl=0;kr=0;boost=0;holdC=0;leafT=0;
  const m=score();sndBoom();
  if(m>best){best=m;try{localStorage.setItem('heli-fpv-best2',best)}catch(e){}}
  bEl.textContent='最高积分 '+best;
  sparks=Array.from({length:70},()=>({a:Math.random()*6.2832,v:120+Math.random()*420,s:1.5+Math.random()*3.5,c:Math.random()}));
}
function showOver(){ov.className='';
  state='over';overAt=performance.now();
  ov.innerHTML='<h1>'+(lastCeil?'损坏了':'坠毁了')+'</h1><p>积分 '+score()+'</p><p>最高积分 '+best+'</p><b>点击继续</b>';
  ov.style.display='flex';
}
function toStart(){
  S=0;px=0;py=0;vx=0;vy=0;roll=0;lastK=0;ax=0;ay=0;pitch=0;danger=0;hitT=0;coins=0;gems=0;lvl=1;lvlT=0;lkx=0;lky=0;sEl.textContent='积分 0';
  ov.innerHTML=START_HTML;ov.className='start';state='idle';
}
function canStart(){return state==='idle'||performance.now()-overAt>400}
const R=72,clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),dz=v=>{const m=Math.abs(v);return m<.06?0:Math.sign(v)*(m-.06)/.94};
addEventListener('pointerdown',e=>{e.preventDefault();initAudio();if(state==='boom')return;if(state==='cine'){if(cineT>1.2){begin();flashT=.6}return}if(state==='cockpit'){if(cockT>1){begin();flashT=.6}return}if(state==='over'){if(canStart())toStart();return}if(state==='idle')start();ph=true;sx0=e.clientX;sy0=e.clientY;ts=0;tv=0});
addEventListener('pointermove',e=>{if(ph){ts=clamp((e.clientX-sx0)/R,-1,1);tv=clamp((sy0-e.clientY)/R,-1,1)}});
const rel=()=>{ph=false;ts=0;tv=0};
addEventListener('pointerup',rel);addEventListener('pointercancel',rel);
const KU=['ArrowUp','KeyW','Space'],KD=['ArrowDown','KeyS'],KL=['ArrowLeft','KeyA'],KR=['ArrowRight','KeyD'];
addEventListener('keydown',e=>{
  const k=e.code;initAudio();
  if([...KU,...KD,...KL,...KR].includes(k)){e.preventDefault();if(state==='boom')return;if(state==='cine'){if(cineT>1.2){begin();flashT=.6}return}if(state==='cockpit'){if(cockT>1){begin();flashT=.6}return}if(state==='over'){if(canStart())toStart();return}if(state==='idle')start();}
  if(KU.includes(k))ku=1;if(KD.includes(k))kd=1;if(KL.includes(k))kl=1;if(KR.includes(k))kr=1;
});
addEventListener('keyup',e=>{
  const k=e.code;
  if(KU.includes(k))ku=0;if(KD.includes(k))kd=0;if(KL.includes(k))kl=0;if(KR.includes(k))kr=0;
});

function autoTarget(){
  const kk=Math.floor(S/D);
  let tx=cx(S+300),ty=cy(S+300);
  for(let j=0;j<=9;j++){
    const o=obstacle(kk+j);
    if(o){
      const s=(kk+j)*D,c=cx(s),cyy=cy(s),limx=hw(s)-20,limy=hh(s)-20,m=o.r+22;
      const cs=[[o.x-m,py],[o.x+m,py],[px,o.y-m],[px,o.y+m]].filter(p=>Math.abs(p[0]-c)<=limx&&Math.abs(p[1]-cyy)<=limy);
      if(cs.length){cs.sort((a,b)=>Math.hypot(a[0]-px,a[1]-py)-Math.hypot(b[0]-px,b[1]-py));tx=cs[0][0];ty=cs[0][1]}
      break;
    }
  }
  for(let j=0;j<=9;j++){
    const tr=tree(kk+j);
    if(tr){
      const s=(kk+j)*D,top=tr.y0+tr.th+tr.ch+30,limy=cy(s)+hh(s)-20,sideX=tr.x+(px>=tr.x?1:-1)*(tr.cr+25);
      if(top<limy)ty=Math.max(ty,top);else if(Math.abs(sideX-cx(s))<=hw(s)-20)tx=sideX;
      break;
    }
  }
  return[tx,ty];
}
function update(dt){
  const cen=ph&&leafT<=0&&Math.abs(ts)<.3&&Math.abs(tv)<.3;
  holdC=cen?holdC+dt:0;
  const bt=holdC>.3?1:0;
  boost+=(bt-boost)*Math.min(1,dt*(bt?1.5:3));
  sp=(420+Math.min(S/60,320))*2.2*(1+.4*boost);
  S+=sp*dt;
  let inX=clamp(dz(ts)+kr-kl,-1,1),inY=clamp(dz(tv)+ku-kd,-1,1);
  if(leafT>0){const g=autoTarget();inX=clamp((g[0]-px)/70,-1,1);inY=clamp((g[1]-py)/70,-1,1)}
  ax+=(inX-ax)*Math.min(1,dt*6);ay+=(inY-ay)*Math.min(1,dt*6);
  vx+=(ax*420-vx)*Math.min(1,dt*12);
  vy+=(ay*300-vy)*Math.min(1,dt*12);
  px+=vx*dt;py+=vy*dt;
  roll+=(vx/420*.16+(cx(S+80)-cx(S))/80*.35-roll)*Math.min(1,dt*5);
  pitch+=(vy/300+(cy(S+80)-cy(S))/80*1.2-pitch)*Math.min(1,dt*4);
  const lx=ax+(cx(S+200)-cx(S))/200*1.2,ly=ay+(cy(S+200)-cy(S))/200*1.2;
  lkx+=(lx-lkx)*Math.min(1,dt*6);lky+=(ly-lky)*Math.min(1,dt*6);
  const dyc=py-cy(S),side=Math.abs(px-cx(S))>hw(S)-5;
  if(side||Math.abs(dyc)>hh(S)-5){die(side||dyc>hh(S)-5);return}
  danger=clamp(1-Math.min(hw(S)-5-Math.abs(px-cx(S)),hh(S)-5-Math.abs(dyc))/45,0,1);
  if(danger>.6&&tm-lastBeep>.28){lastBeep=tm;sndBeep()}
  const k=Math.floor(S/D);
  if(k!==lastK){
    lastK=k;const o=obstacle(k);
    if(o&&Math.abs(px-o.x)<o.r+4&&Math.abs(py-o.y)<o.r+4){die();return}
    const cn=coin(k);
    if(cn&&Math.abs(px-cn.x)<cn.r+34&&Math.abs(py-cn.y)<cn.r+34){if(cn.gem){gems++;coinT=1;coinCol='120,255,220'}else{coins++;coinT=.6;coinCol='170,185,255'}}
  }
  const tr=tree(Math.round(S/D));
  if(tr){const th=treeHit(tr);if(th===2){die();return}if(th===1&&tm-lastLeaf>2){lastLeaf=tm;startLeaves()}}
  const nl=lvlAt(S);
  if(nl!==lvl){lvl=nl;lvlT=3;sndLevel()}
  sEl.textContent='积分 '+score();
}

// 绘制
const CEIL=[70,72,78],FLOOR=[46,96,60],WALL=[88,82,76],OBS=[239,71,111];
const TINT=[[1,1,1],[.8,1.05,1.12],[1.2,.95,.85],[1,1.1,.85],[1.1,1.05,.8]];
function col(b,k,t){
  const m=(k&1)?1:.66,f=Math.pow(t,.75),T=(b===CEIL||b===WALL)?TINT[(lvl-1)%5]:[1,1,1];
  return'rgb('+((b[0]*T[0]*m*(1-f)+14*f)|0)+','+((b[1]*T[1]*m*(1-f)+14*f)|0)+','+((b[2]*T[2]*m*(1-f)+20*f)|0)+')';
}
function quad(a,b,c2,d,fill){
  x.fillStyle=fill;x.strokeStyle=fill;x.lineWidth=1;
  x.beginPath();x.moveTo(a[0],a[1]);x.lineTo(b[0],b[1]);x.lineTo(c2[0],c2[1]);x.lineTo(d[0],d[1]);x.closePath();x.fill();x.stroke();
}
const STARS=Array.from({length:520},(_,i)=>({a:hash(i*3+1)*6.2832,z:hash(i*3+2),c:i%9}));
function ore(sx,sy,r,k,t){
  const rot=tm*1.4+k,n=7;
  x.fillStyle=col([140,150,220],k,t);x.globalAlpha=.18*(1-t*.8);x.beginPath();x.arc(sx,sy,r*1.7,0,7);x.fill();x.globalAlpha=1;
  x.beginPath();
  for(let i=0;i<n;i++){const a=rot+i*6.2832/n,rr=r*(.75+.35*hash(k*7+i)),ox=sx+Math.cos(a)*rr,oy=sy+Math.sin(a)*rr*.9;i?x.lineTo(ox,oy):x.moveTo(ox,oy)}
  x.closePath();x.fillStyle=col([22,22,30],k,t);x.fill();
  x.strokeStyle=col([120,130,180],k,t);x.lineWidth=Math.max(1,r*.12);x.stroke();
  x.fillStyle=col([210,220,255],k,t);x.globalAlpha=.8;x.beginPath();x.arc(sx-r*.3,sy-r*.35,Math.max(.8,r*.16),0,7);x.fill();x.globalAlpha=1;
}
const GC=[[80,230,255],[255,90,200],[110,255,140],[255,220,90]];
function gem(sx,sy,r,k,t,ci){
  const c=GC[ci],tw=.5+.5*Math.sin(tm*4+k);
  x.fillStyle=col(c,k,t);x.globalAlpha=(.22+.18*tw)*(1-t*.8);x.beginPath();x.arc(sx,sy,r*2.2,0,7);x.fill();x.globalAlpha=1;
  x.beginPath();x.moveTo(sx,sy-r*1.1);x.lineTo(sx+r*.9,sy-r*.2);x.lineTo(sx,sy+r*1.15);x.lineTo(sx-r*.9,sy-r*.2);x.closePath();
  x.fillStyle=col(c,k,t);x.fill();
  x.fillStyle=col([255,255,255],k,t);x.globalAlpha=.55;x.beginPath();x.moveTo(sx,sy-r*1.1);x.lineTo(sx+r*.9,sy-r*.2);x.lineTo(sx-r*.9,sy-r*.2);x.closePath();x.fill();x.globalAlpha=1;
  x.strokeStyle=col([255,255,255],k,t);x.lineWidth=Math.max(1,r*.1);x.beginPath();x.moveTo(sx,sy-r*1.1);x.lineTo(sx+r*.9,sy-r*.2);x.lineTo(sx,sy+r*1.15);x.lineTo(sx-r*.9,sy-r*.2);x.closePath();x.stroke();
}
function devil(sx,sy,h,t,mv){

function drawBanner(){if(lvlT>0)drawCard(lvl,Math.max(0,Math.min(1,(3-lvlT)/.3,lvlT/.4)))}

function newLeaf(){
  const C=['#3f9a4e','#6bbf59','#a6d65c','#2f7a45','#d9c34a','#8fcf6a'];
  const a=Math.random()*6.2832,v=150+Math.random()*650;
  return{x:Math.random()*W,y:Math.random()*H,vx:Math.cos(a)*v,vy:Math.sin(a)*v-100,r:Math.random()*6.2832,vr:(Math.random()-.5)*14,s:6+Math.random()*14,c:C[Math.floor(Math.random()*6)],ph:Math.random()*6.28};
}
function startLeaves(){leafT=3.6;leaves=Array.from({length:320},newLeaf)}
function drawLeaves(dt){
  if(leafT<=0)return;
  leafT-=dt;
  if(leafT>2.4&&leaves.length<600)for(let i=0;i<8;i++)leaves.push(newLeaf());
  x.save();
  x.fillStyle='rgba(30,90,45,'+Math.min(.3,leafT*.12)+')';x.fillRect(0,0,W,H);
  for(const l of leaves){
    l.vx*=1-dt;l.vy=l.vy*(1-dt)+150*dt;
    l.x+=(l.vx+Math.sin(tm*3+l.ph)*60)*dt;l.y+=l.vy*dt;l.r+=l.vr*dt;
    x.globalAlpha=Math.max(0,Math.min(1,leafT/1.4));
    x.save();x.translate(l.x,l.y);x.rotate(l.r);x.fillStyle=l.c;
    x.beginPath();x.ellipse(0,0,l.s,l.s*.45,0,0,7);x.fill();x.restore();
  }
  x.restore();
}
function drawExplosion(){
  const t=boomT,ex=W/2,ey=Hc+H*.06;
  x.save();
  x.fillStyle='rgba(10,5,5,'+Math.min(.45,t*.4)+')';x.fillRect(0,0,W,H);
  const fa=Math.max(0,1-t/1.2),fr=W*(.12+t*.9);
  if(fa>0){
    const g=x.createRadialGradient(ex,ey,0,ex,ey,fr);
    g.addColorStop(0,'rgba(255,255,230,'+fa+')');g.addColorStop(.3,'rgba(255,200,70,'+fa*.9+')');g.addColorStop(.65,'rgba(255,90,20,'+fa*.7+')');g.addColorStop(1,'rgba(120,20,0,0)');
    x.fillStyle=g;x.beginPath();x.arc(ex,ey,fr,0,7);x.fill();
    x.strokeStyle='rgba(255,230,180,'+fa*.8+')';x.lineWidth=4;x.beginPath();x.arc(ex,ey,W*t*1.5,0,7);x.stroke();
  }
  if(t<1.3){
    for(const p of sparks){
      const d=p.v*t,sx=ex+Math.cos(p.a)*d,sy=ey+Math.sin(p.a)*d+300*t*t;
      x.globalAlpha=Math.max(0,1-t/1.3);x.fillStyle=p.c<.5?'#ffd23f':'#ff7a1a';
      x.beginPath();x.arc(sx,sy,Math.max(.3,p.s*(1-t/1.6)),0,7);x.fill();
    }
    x.globalAlpha=1;
  }
  for(let i=0;i<6;i++){
    const a=i*1.05,rr=W*(.1+t*.25),sx=ex+Math.cos(a)*W*.24*t,sy=ey-t*H*.06*(1+i%2)+Math.sin(a)*W*.08*t;
    x.fillStyle='rgba(25,20,20,'+Math.min(.3,t*.36)+')';x.beginPath();x.arc(sx,sy,rr,0,7);x.fill();
  }
  const fl=Math.max(0,1-t*4);
  if(fl>0){x.fillStyle='rgba(255,235,190,'+fl+')';x.fillRect(0,0,W,H)}
  x.restore();
}

function drawCockScene(al){

    x.beginPath();x.moveTo(vx+Math.cos(a)*r0,vy+Math.sin(a)*r0*.8);x.lineTo(vx+Math.cos(a)*r1,vy+Math.sin(a)*r1*.8);x.stroke();
  }

  x.fillStyle='rgba(80,200,255,'+(.04+.03*Math.sin(tm*9))+')';x.fillRect(rx,ry,rw,rh);
  x.fillStyle='rgba(140,235,255,.14)';x.fillRect(rx,ry+((tm*70)%rh),rw,3);
  x.restore();
  const vg=x.createRadialGradient(W/2,H*.5,Math.min(W,H)*.4,W/2,H*.5,Math.max(W,H)*.8);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.4)');
  x.fillStyle=vg;x.fillRect(-4,-4,W+8,H+8);

}
let hcv=null;
function buildHeli(){
  if(hcv||!(SP.complete&&SP.naturalWidth))return;
  hcv=document.createElement('canvas');hcv.width=SPI.w;hcv.height=SPI.h;
  const g=hcv.getContext('2d');g.drawImage(SP,0,0,SPI.w,SPI.h);
  g.globalCompositeOperation='source-atop';
  g.fillStyle='rgba(120,55,30,.14)';g.fillRect(0,0,SPI.w,SPI.h);
  const dg=g.createLinearGradient(0,SPI.h*.55,0,SPI.h);dg.addColorStop(0,'rgba(170,100,60,0)');dg.addColorStop(1,'rgba(170,100,60,.5)');
  g.fillStyle=dg;g.fillRect(0,0,SPI.w,SPI.h);
  const rg=g.createLinearGradient(SPI.w*.4,0,SPI.w,0);rg.addColorStop(0,'rgba(255,150,80,0)');rg.addColorStop(1,'rgba(255,150,80,.18)');
  g.fillStyle=rg;g.fillRect(0,0,SPI.w,SPI.h);
  g.globalCompositeOperation='source-over';
}
function drawCine(al){
  buildHeli();
  const t=cineT;
  const rs=Math.min(1,t/1.6);
  const u=Math.max(0,Math.min(1,(t-2)/2.2)),lift=ease(u);
  const q=Math.pow(Math.max(0,Math.min(1,(t-4.4)/1.5)),2.2),fl=ease((t-5.5)/.9),c1=ease((t-4.2)/2.2);
  const near=1-Math.min(1,lift*4);
  x.save();x.globalAlpha=al;
  const shk=0;
  x.translate(Math.sin(tm*83)*shk,Math.cos(tm*71)*shk);
  const pw=PL.naturalWidth,ph=PL.naturalHeight,s0=Math.max(H/ph,W/pw),s=s0*(1+.12*c1),camx=c1*260;
  x.drawImage(PL,-camx*s,-(ph*s-H)*(.45-.3*lift),pw*s,ph*s);

  const wash=rs*Math.max(0,1-hgt/(H*.22)),hx0=W/2;
  // 机身压在地面上的柔和阴影（先深后浅，边缘融进地面）
  const sh=(1-Math.min(1,hgt/(H*.3)))*(1-q);
  if(sh>.01){
    const R=W*.5*(1+hgt/H*.8),shg=x.createRadialGradient(hx0,gy+6,0,hx0,gy+6,R);
    shg.addColorStop(0,'rgba(0,0,0,'+(.6*sh*al)+')');shg.addColorStop(.55,'rgba(0,0,0,'+(.28*sh*al)+')');shg.addColorStop(1,'rgba(0,0,0,0)');
    x.save();x.translate(0,gy+6);x.scale(1,.13);x.translate(0,-(gy+6));x.fillStyle=shg;x.beginPath();x.arc(hx0,gy+6,R,0,7);x.fill();x.restore();
  }
  // 后排尘雾
  const dust=(n,seed,front)=>{
    for(let i=0;i<n;i++){
      const ph2=(t*.9+hash(i+seed))%1,side=hash(i+seed+10)<.5?-1:1,dx=side*(W*(front?.06:.12)+ph2*W*(front?.5:.7))+(hash(i+seed+30)-.5)*W*.12,yy=gy+(hash(i+seed+20)-.5)*H*.035-ph2*H*.05+(front?H*.012:0),r=W*((front?.05:.06)+(front?.12:.2)*ph2);
      x.fillStyle='rgba(185,110,62,'+((front?.2:.26)*wash*(1-ph2)*al)+')';x.beginPath();x.ellipse(hx0+dx,yy,r,r*.42,0,0,7);x.fill();
    }
  };
  if(wash>.01){
    const hg=x.createLinearGradient(0,gy-H*.05,0,gy+H*.03);hg.addColorStop(0,'rgba(185,110,62,0)');hg.addColorStop(1,'rgba(185,110,62,'+(.3*wash*al)+')');
    x.fillStyle=hg;x.fillRect(0,gy-H*.05,W,H*.08);
    dust(90,1500);
    for(let i=0;i<30;i++){const ph2=(t*1.6+hash(i+1600))%1,side=hash(i+1610)<.5?-1:1;
      x.fillStyle='rgba(40,22,14,'+(.6*wash*(1-ph2)*al)+')';x.fillRect(hx0+side*(W*.1+ph2*W*.8),gy-ph2*H*.09*hash(i+1620)-2,2+hash(i+1630)*3,1.5+hash(i+1640)*2)}
  }
  // 直升机：起飞后一直朝前（朝右、朝远处）加速飞走，越飞越小，直到快要消失
  const kb=W*.98/SPI.w;
  const heli=(hx,cy,k,pitch,a,rotor)=>{
    x.save();x.globalAlpha=al*a;
    x.translate(hx,cy-SPI.bot*k+SPI.h*k/2);x.rotate(pitch);x.scale(k,k);x.translate(-SPI.w/2,-SPI.h/2);
    x.drawImage(hcv||SP,0,0);
    if(rotor){
      x.save();x.translate(SPI.hx,SPI.hy);
      const Lb=690,ry=34;
      x.fillStyle='rgba(15,8,6,'+(.16*rs*al*a)+')';x.beginPath();x.ellipse(0,0,Lb,ry*1.5,0,0,7);x.fill();
      x.fillStyle='#0b0706';
      for(let gh=3;gh>=0;gh--){
        x.globalAlpha=al*a*(gh?.12:.55)*(.2+.8*rs);
        const a0=cRot-gh*.09;
        for(let b=0;b<4;b++){const an=a0+b*1.5708,ex=Math.cos(an)*Lb,ey=Math.sin(an)*ry;
          x.beginPath();x.moveTo(0,-9);x.lineTo(ex,ey-5);x.lineTo(ex,ey+5);x.lineTo(0,9);x.closePath();x.fill()}
      }
      x.restore();
    }
    x.restore();

  heli(hxs,cy,k,pitch,1,true);

    x.fillStyle=fg;x.fillRect(0,gy-H*.025,W,H*.045);
  }

  x.restore();
}

  if(state==='cine'){
    if(cineT<.5){bgPh+=dt/.3;drawTunnelBg(1)}
    drawCine(Math.min(1,cineT/.5));
  }
  if(state==='cockpit')drawCockScene(1);
  x.restore();
  drawLeaves(dt);
  if(state==='boom'||state==='over')drawExplosion();
  if(state==='over')drawCracks();
  if(hitT>0){x.fillStyle='rgba(255,60,40,'+Math.min(.6,hitT*.45)+')';x.fillRect(0,0,W,H)}
  if(coinT>0){x.fillStyle='rgba('+coinCol+','+coinT*.12+')';x.fillRect(0,0,W,H)}
  if(state==='play')drawBanner();
  if(flashT>0){flashT-=dt;x.fillStyle='rgba(210,230,255,'+Math.max(0,flashT/.8)+')';x.fillRect(0,0,W,H)}
  if(state==='intro')drawIntro();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
